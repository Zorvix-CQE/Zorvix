  e.textContent = 'No se pudo cargar el acceso de Google. Revise su conexión o desactive el bloqueador de anuncios para este sitio.';
  e.classList.remove('oculto');
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gsiListo()" onerror="gsiFallo()"></script>
<script>
const CONFIG = {
  GATEWAY:   'https://script.google.com/macros/s/AKfycbw8NKRDlqc2R6ElDouCn62KYUTadUUW_xFBZ2e2gofjK6SsdM1HtxKgyR4KRMk4ZzrVrA/exec',
  CLIENT_ID: '148311031818-4ku0lhia6qd0fgbmi379dvi7k4vp303g.apps.googleusercontent.com'
};

let SESION = null, MEDICO_ACTIVO = null, DOC_PENDIENTE = null, MI_EXPEDIENTE = null, URL_ACTUAL = null;

async function api(action, datos = {}) {
  const token = sessionStorage.getItem('zx_token');
  const r = await fetch(CONFIG.GATEWAY, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token, ...datos })
  });
  const res = await r.json();
  if (!res.ok) {
    if (/sesión/i.test(res.error)) { sessionStorage.removeItem('zx_token'); ver('v-acceso'); }
    throw new Error(res.error);
  }
  return res.data;
}

function ver(id) {
  ['v-acceso','v-medico','v-staff','v-detalle'].forEach(v =>
    document.getElementById(v).classList.toggle('oculto', v !== id));
}

let DOM_LISTO = false, YA_ARRANCO = false;

window.arrancar = function () {
  if (!window.__gsi || !DOM_LISTO || YA_ARRANCO) return;
  YA_ARRANCO = true;

  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: r => { sessionStorage.setItem('zx_token', r.credential); iniciar(); },
    auto_select: true
  });
  google.accounts.id.renderButton(document.getElementById('btn-google'),
    { theme: 'filled_black', size: 'large', width: 320, text: 'continue_with', locale: 'es' });

  if (sessionStorage.getItem('zx_token')) iniciar();
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { DOM_LISTO = true; window.arrancar(); });
} else { DOM_LISTO = true; window.arrancar(); }

async function iniciar() {
  try {
    SESION = await api('cirujanos.sesion');
    // Una sola app, dos caras: cada rol ve su propia estética.
    const raiz = document.documentElement;
    if (SESION.esStaff) {
      // Herramienta de trabajo: clara. Quien revisa expedientes ocho horas
      // no necesita espectáculo, necesita leer sin cansarse.
      raiz.dataset.tema = 'claro';
      document.getElementById('yo2').textContent = SESION.nombre || SESION.correo;
      verLista();
    } else {
      // El médico es un cliente y ésta es su primera impresión de Zorvix.
      raiz.dataset.tema = 'oscuro';
      document.getElementById('yo').textContent = SESION.nombre || SESION.correo;
      verMio();
    }
  } catch (e) {
    document.getElementById('err').textContent = e.message;
    document.getElementById('err').classList.remove('oculto');
    ver('v-acceso');
  }
}

/* ---------- Escala de datos ---------- */

/**
 * La direccion del color no la decide el grafico: la decide la polaridad
 * declarada de la metrica, en la pestana Metricas del nucleo.
 *
 *   alto_bueno -> mas es mejor. El arco crece hacia aqua y cierra en palomita.
 *   alto_malo  -> mas es peor.  El arco crece hacia magenta.
 *   neutra     -> no hay extremo deseable. Solo magnitud, sin halo de color.
 *
 * Regla de marcas: si el grafico tiene varias marcas comparables, la rampa es
 * textura identica en todas y el dato lo lleva el tamano. Variar el color por
 * valor ahi crearia agrupaciones falsas: dos barras que caen en azul se leen
 * como si fueran del mismo tipo, y no lo son.
 *
 * Hoy la polaridad va escrita en cada llamada. Cuando Pulso necesite leerla
 * del Sheet, este objeto se llena desde el motor y no cambia nada mas.
 */
const ZX_ESCALA = {
  alto_malo:  [[0,'#00D2BE'],[0.26,'#2E9BD8'],[0.55,'#7B5FC7'],[0.80,'#B15FD8'],[1,'#F26FCB']],
  alto_bueno: [[0,'#F26FCB'],[0.20,'#B15FD8'],[0.45,'#7B5FC7'],[0.74,'#2E9BD8'],[1,'#00D2BE']],
  neutra:     [[0,'#00D2BE'],[0.26,'#2E9BD8'],[0.55,'#7B5FC7'],[0.80,'#B15FD8'],[1,'#F26FCB']]
};

function zxMezcla(a, b, t) {
  const h = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
  const [r1,g1,b1] = h(a), [r2,g2,b2] = h(b);
  const v = (x,y) => Math.round(x + (y - x) * t).toString(16).padStart(2,'0');
  return '#' + v(r1,r2) + v(g1,g2) + v(b1,b2);
}

/* Color exacto donde termina el arco. Es el que toma el halo. */
function zxColorEn(frac, pol) {
  const e = ZX_ESCALA[pol] || ZX_ESCALA.neutra;
  const f = Math.max(0, Math.min(1, frac));
  for (let i = 1; i < e.length; i++) {
    if (f <= e[i][0]) return zxMezcla(e[i-1][1], e[i][1], (f - e[i-1][0]) / (e[i][0] - e[i-1][0]));
  }
  return e[e.length - 1][1];
}

/* Paradas recortadas al tramo que se dibuja y reescaladas a 0-1. Sin esto el
   arco ensena la rampa completa comprimida y el 20% ya se ve magenta. */
function zxParadas(frac, pol) {
  const e = ZX_ESCALA[pol] || ZX_ESCALA.neutra;
  const f = Math.max(0.001, Math.min(1, frac));
  const out = [];
  for (const [p, col] of e) if (p < f) out.push([p / f, col]);
  out.push([1, zxColorEn(f, pol)]);
  return out.map(([p, col]) => `<stop offset="${p.toFixed(3)}" stop-color="${col}"/>`).join('');
}

/* El halo solo existe en oscuro. Sobre el lienzo claro del staff se vuelve
   una mancha sucia alrededor del trazo. */
function zxHalo(color, radio) {
  return document.documentElement.dataset.tema === 'oscuro'
    ? `filter:drop-shadow(0 0 ${radio}px ${color}b3)`
    : '';
}

/* ---------- Anillo de avance ---------- */

/**
 * Metrica docs_entregados: alto_bueno. Arranca en magenta y termina en aqua.
 * Al completarse, la palomita blanca carga el estado y el arco deja de opinar
 * en tono: dos verdes concentricos serian redundancia, no enfasis.
 */
function anillo(listos, total, tam) {
  const grande = tam === 'grande';
  const r = grande ? 50 : 23;
  const w = grande ? 10 : 6;
  const vb = r * 2 + w + 20, c = vb / 2;
  const largo = 2 * Math.PI * r;
  const frac = total ? listos / total : 0;
  const hecho = frac * largo;
  const uid = 'ar' + Math.random().toString(36).slice(2, 8);
  const completo = listos === total && total > 0;
  const fin = zxColorEn(frac, 'alto_bueno');
  const s = grande ? 1 : 0.56;

  const centro = completo
    ? `<path d="M ${(c - 13 * s).toFixed(1)} ${(c + 1 * s).toFixed(1)}
                l ${(9 * s).toFixed(1)} ${(9 * s).toFixed(1)}
                l ${(20 * s).toFixed(1)} ${(-22 * s).toFixed(1)}"
             fill="none" stroke="#FFFFFF" stroke-width="${(7 * s).toFixed(1)}"
             stroke-linecap="round" stroke-linejoin="round"/>`
    : `<text x="${c}" y="${c + (grande ? -2 : 4)}" text-anchor="middle"
             font-family="${grande ? 'Space Grotesk, sans-serif' : 'JetBrains Mono, monospace'}"
             font-size="${grande ? 30 : 12}" fill="var(--zx-txt)">${listos}/${total}</text>
       ${grande ? `<text x="${c}" y="${c + 18}" text-anchor="middle" font-family="Inter, sans-serif"
             font-size="9.5" fill="var(--zx-txt-3)">entregados</text>` : ''}`;

  return `
    <svg viewBox="0 0 ${vb} ${vb}" width="${grande ? 116 : 52}" height="${grande ? 116 : 52}"
         style="flex-shrink:0;${zxHalo(fin, grande ? 14 : 8)}" role="img">
      <title>${listos} de ${total} documentos entregados</title>
      <desc>${completo ? 'Documentación completa.' : 'Anillo de avance.'}</desc>
      <defs><linearGradient id="${uid}" x1="0" y1="1" x2="1" y2="0">${zxParadas(frac, 'alto_bueno')}</linearGradient></defs>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--zx-pista)" stroke-width="${w}"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#${uid})" stroke-width="${w}"
              stroke-linecap="round" stroke-dasharray="${hecho} ${largo}" transform="rotate(-90 ${c} ${c})"/>
      ${centro}
    </svg>`;
}

/* ---------- Médico ---------- */

async function verMio() {
  ver('v-medico');
  try {
    const d = await api('cirujanos.mios');
    MI_EXPEDIENTE = d;
    pintarSaludo(d);
    document.getElementById('m-docs').innerHTML = d.documentos.map(tarjetaDoc).join('');
  } catch (e) {
    document.getElementById('m-docs').innerHTML = `<p style="color:var(--zx-error-txt);font-size:12.5px">${e.message}</p>`;
  }
}

/**
 * Tres mensajes, no uno fijo. Este médico es un cliente que paga y ésta es
 * la primera pantalla de Zorvix que ve en su vida.
 */
function pintarSaludo(d) {
  const r = d.resumen, doc = d.medico.corto;
  const fem = /Dra/i.test(d.medico.tratamiento || '');
  let titulo, mensaje;

  const vencidos = d.documentos.filter(x => x.estado === 'vencido');
  const porVencer = d.documentos.filter(x => x.estado === 'por_vencer')
    .sort((a, b) => a.dias - b.dias)[0];

  if (r.subidos === 0) {
    titulo = (fem ? 'Bienvenida' : 'Bienvenido') + ', ' + doc;
    mensaje = `Antes de su primera cirugía en Zorvix necesitamos tener su documentación en orden. `
            + `Son ${r.total} documentos y puede subirlos desde su celular en unos minutos. `
            + `Después no vuelve a pensar en esto: nosotros le avisamos cuando algo esté por vencer.`;
  } else if (vencidos.length) {
    titulo = doc + ', tiene documentación vencida';
    mensaje = vencidos.length === 1
      ? `Su ${vencidos[0].nombre.toLowerCase()} venció hace ${Math.abs(vencidos[0].dias)} días. `
        + `Mientras no esté vigente no podemos programarle cirugías.`
      : `Tiene ${vencidos.length} documentos vencidos. Mientras no estén vigentes no podemos programarle cirugías.`;
  } else if (r.bloqueado) {
    const faltan = d.documentos.filter(x => x.obligatorio && x.estado === 'falta');
    titulo = doc + ', le falta' + (faltan.length === 1 ? ' un documento' : 'n ' + faltan.length + ' documentos');
    mensaje = faltan.length === 1
      ? `Solo falta su ${faltan[0].nombre.toLowerCase()} y su expediente queda completo. `
        + `Puede subirlo desde su celular en un minuto.`
      : `Puede subirlos desde su celular en unos minutos. Nosotros le avisamos cuando algo esté por vencer.`;
  } else {
    titulo = 'Todo en orden, ' + doc;
    mensaje = porVencer
      ? `Su documentación está vigente. Lo próximo que vence es su ${porVencer.nombre.toLowerCase()}, en ${porVencer.dias} días.`
      : `Su documentación está vigente y completa. Le avisaremos con 60 días de anticipación cuando algo esté por vencer.`;
  }

  document.getElementById('m-saludo').textContent = titulo;
  document.getElementById('m-mensaje').textContent = mensaje;
  document.getElementById('m-anillo').innerHTML = anillo(r.listos, r.total, 'grande');
}

/* ---------- Documento ---------- */

const ETIQUETAS = {
  falta:        ['Falta',       'error'],
  vencido:      ['Vencido',     'error'],
  por_vencer:   ['Por vencer',  'alerta'],
  por_verificar:['En revisión', 'alerta'],
  rechazado:    ['Rechazado',   'error'],
  vigente:      ['Vigente',     'ok']
};

// El tinte de la tarjeta separa listo, en proceso y pendiente antes de
// que el ojo lea una sola palabra.
const TINTES = {
  vigente:      'zx-t-ok',
  por_verificar:'zx-t-espera',
  por_vencer:   'zx-t-espera',
  vencido:      'zx-t-mal',
  rechazado:    'zx-t-mal',
  falta:        'zx-t-nada'
};

function sub(d) {
  return d.estado === 'por_vencer' ? `Vence en ${d.dias} días`
       : d.estado === 'vencido'    ? `Venció hace ${Math.abs(d.dias)} días`
       : d.fechaVence              ? `Vence ${String(d.fechaVence).slice(0,10)}`
       : d.obligatorio             ? 'Obligatorio' : 'Opcional';
}

/** Tarjeta de documento. La misma para médico y staff; cambia lo que puede hacer. */
function tarjetaDoc(d) {
  const [txt, tono] = ETIQUETAS[d.estado] || ['—',''];
  const esStaff = SESION && SESION.esStaff;
  const revisar = esStaff && d.estado === 'por_verificar';
  return `
    <div class="zx-widget ${TINTES[d.estado] || ''}">
      <span class="zx-anillo" style="width:40px;height:40px">
        <i class="ti ${d.credId ? 'ti-file-check' : 'ti-file-plus'}" style="font-size:19px" aria-hidden="true"></i>
      </span>
      <div class="doc-nom">${d.nombre}</div>
      <div class="doc-sub">${sub(d)}${d.nota ? ' · ' + d.nota : ''}</div>
      <div class="barra-estado"></div>
      <div class="pie">
        <span class="zx-pill ${tono}" style="font-size:10px">${txt}</span>
        ${revisar ? `
          <button class="zx-btn val-ok" style="margin-left:auto;height:29px;padding:0 12px;font-size:12px"
                  onclick="event.stopPropagation();validar('${d.credId}', true)">Aprobar</button>
          <button class="zx-btn-2 val-no" style="height:29px;padding:0 12px;font-size:12px"
                  onclick="event.stopPropagation();validar('${d.credId}', false)">Rechazar</button>` : ''}
        ${d.credId ? `<button class="zx-btn-2" style="${revisar ? '' : 'margin-left:auto;'}height:29px;padding:0 13px;font-size:12px"
             onclick="abrirDoc('${d.credId}')">Ver</button>` : ''}
        <button class="${d.credId ? 'zx-btn-2' : 'zx-btn'}" style="${d.credId ? '' : 'margin-left:auto;'}height:29px;padding:0 14px;font-size:12px"
             onclick="pedirArchivo('${d.id}', ${d.vence})">${d.credId ? 'Cambiar' : 'Subir'}</button>
      </div>
    </div>`;
}

/**
 * Aprobar o rechazar. Al rechazar se pide el motivo: el médico tiene que
 * saber qué corregir, si no vuelve a subir lo mismo.
 */
async function validar(credId, aprobar) {
  let nota = '';
  if (!aprobar) {
    nota = prompt('¿Por qué se rechaza? El médico va a ver este mensaje.\nPor ejemplo: la foto está ilegible.');
    if (nota === null) return;
  }
  try {
    await api('cirujanos.verificar', { credId, aprobar, nota });
    verDetalle(MEDICO_ACTIVO);
  } catch (e) { alert(e.message); }
}

/* ---------- Staff ---------- */

function verAlta(mostrar) {
  document.getElementById('s-alta').classList.toggle('oculto', !mostrar);
  document.getElementById('a-msg').textContent = '';
  if (mostrar) document.getElementById('a-nombre').focus();
}

async function darAlta() {
  const g = i => document.getElementById(i).value.trim();
  const titulo = document.getElementById('a-titulo').value;
  const nombre = g('a-nombre'), apellido = g('a-apellido'), correo = g('a-correo').toLowerCase();
  const msg = document.getElementById('a-msg');
  if (!nombre || !apellido) { msg.textContent = 'Faltan nombre y apellido.'; return; }
  if (!correo) { msg.textContent = 'Falta el correo de Google.'; return; }

  msg.textContent = 'Guardando…';
  try {
    await api('cirujanos.alta', {
      tratamiento: titulo, nombre, apellido, correo,
      especialidad: g('a-esp'),
      tipo: document.getElementById('a-tipo').value
    });

    // El sistema ya lo registró en Roles: nadie tiene que abrir la hoja.
    const doc = titulo + ' ' + apellido;
    const enlace = location.origin + location.pathname;
    document.getElementById('i-quien').textContent =
      doc + ' ya puede entrar con ' + correo + '. Mándele este mensaje:';
    document.getElementById('i-texto').value =
      doc + ', le comparto el acceso al portal de Zorvix para su documentación.\n\n' +
      enlace + '\n\n' +
      'Entre con su cuenta de Google ' + correo + '. Ahí puede subir sus documentos ' +
      'desde el celular y nosotros le avisamos cuando algo esté por vencer.';
    document.getElementById('s-invita').classList.remove('oculto');

    ['a-nombre','a-apellido','a-esp','a-correo'].forEach(i => document.getElementById(i).value = '');
    verAlta(false);
    verLista();
  } catch (e) { msg.textContent = e.message; }
}

function copiarInvitacion() {
  const t = document.getElementById('i-texto');
  navigator.clipboard.writeText(t.value).then(function () {
    document.getElementById('i-msg').textContent = 'Copiado';
    setTimeout(function () { document.getElementById('i-msg').textContent = ''; }, 2500);
  });
}

function cerrarInvita() {
  document.getElementById('s-invita').classList.add('oculto');
}

/** Barras del widget de altas: una por médico, altura por avance. */
function miniBarras(meds) {
  const n = Math.min(meds.length, 15);
  if (!n) return '';
  const anc = 7, sep = 11;
  const barras = meds.slice(-n).map((m, i) => {
    const alto = Math.max(5, Math.round((m.listos / (m.total || 1)) * 30));
    return `<rect x="${i * sep}" y="${34 - alto}" width="${anc}" height="${alto}" rx="3"/>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${n * sep} 34" width="100%" height="34" style="margin-top:12px;position:relative" role="img">
      <title>Avance por médico</title><desc>Barras de documentación completada.</desc>
      <defs><linearGradient id="mb" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="var(--zx-d-0)"/><stop offset="0.30" stop-color="var(--zx-d-26)"/>
        <stop offset="0.62" stop-color="var(--zx-d-55)"/><stop offset="1" stop-color="var(--zx-d-100)"/>
      </linearGradient></defs>
      <g fill="url(#mb)">${barras}</g>
    </svg>`;
}

/* Metrica docs_por_revisar: alto_malo. Cero pendientes se ve aqua y casi
   vacio; la cola creciendo empuja el medidor hacia magenta. */
function medidor(parte, total) {
  const frac = total ? Math.min(parte / total, 1) : 0;
  const fin = zxColorEn(frac, 'alto_malo');
  return `
    <svg viewBox="0 0 100 58" width="92" height="54" style="position:relative;${zxHalo(fin, 10)}" role="img">
      <title>${parte} de ${total} por revisar</title><desc>Medidor semicircular.</desc>
      <defs><linearGradient id="md" x1="0" y1="0" x2="1" y2="0">${zxParadas(frac, 'alto_malo')}</linearGradient></defs>
      <path d="M10 50 A40 40 0 0 1 90 50" fill="none" stroke="var(--zx-pista)" stroke-width="9" stroke-linecap="round"/>
      <path d="M10 50 A40 40 0 0 1 90 50" fill="none" stroke="url(#md)" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${(frac * 126).toFixed(1)} 126"/>
    </svg>`;
}

async function verLista() {
  ver('v-staff');
  const met = document.getElementById('s-metricas');
  const c = document.getElementById('s-lista');
  try {
    const meds = await api('cirujanos.listar');

    const porRevisar = meds.reduce((s, m) => s + m.porVerificar, 0);
    const bloqueados = meds.filter(m => m.bloqueado);
    const critico = bloqueados[0];

    // El tablero responde primero la pregunta del staff: ¿alguien no puede
    // operar hoy? Después viene la lista.
    met.innerHTML = `
      <div class="zx-widget">
        <div class="zx-widget-etq">Cirujanos activos</div>
        <div class="zx-widget-num">${meds.length}</div>
        ${miniBarras(meds)}
      </div>
      <div class="zx-widget">
        <div class="zx-widget-etq">Por revisar</div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between">
          <div class="zx-widget-num" ${porRevisar ? 'style="color:var(--zx-alerta-txt)"' : ''}>${porRevisar}</div>
          ${medidor(porRevisar, Math.max(meds.length, 1))}
        </div>
        <div class="zx-widget-pie">Documentos esperando validación</div>
      </div>
      <div class="zx-widget ${bloqueados.length ? 'zx-t-mal' : ''}">
        <div class="zx-widget-etq">No pueden operar</div>
        <div class="zx-widget-num" ${bloqueados.length ? 'style="color:var(--zx-error-txt)"' : ''}>${bloqueados.length}</div>
        ${critico
          ? `<div style="margin-top:14px;position:relative"><span class="zx-pill error" style="font-size:10px">Documentación incompleta</span></div>
             <div class="zx-widget-pie">${critico.nombre}${bloqueados.length > 1 ? ' y ' + (bloqueados.length - 1) + ' más' : ''}</div>`
          : '<div class="zx-widget-pie" style="margin-top:14px">Todos con documentación al día</div>'}
      </div>`;

    if (!meds.length) {
      c.innerHTML = '<p style="grid-column:1/-1;color:var(--zx-txt-3);font-size:12.5px">Aún no hay médicos dados de alta.</p>';
      return;
    }

    c.innerHTML = meds.map(m => `
      <div class="zx-widget med ${m.bloqueado ? 'zx-t-mal' : m.porVerificar ? 'zx-t-espera' : 'zx-t-ok'}"
           onclick="verDetalle('${m.medicoId}')">
        ${anillo(m.listos, m.total)}
        <div style="min-width:0;position:relative">
          <div class="med-nom">${m.nombre}</div>
          <div class="med-esp">${m.especialidad || m.tipo}</div>
          <span class="zx-pill ${m.bloqueado ? 'error' : m.porVerificar ? 'alerta' : 'ok'}"
                style="font-size:10px;margin-top:9px">${
            m.bloqueado ? 'Incompleto' : m.porVerificar ? m.porVerificar + ' por revisar' : 'Vigente'}</span>
        </div>
      </div>`).join('');
  } catch (e) {
    met.innerHTML = '';
    c.innerHTML = `<p style="grid-column:1/-1;color:var(--zx-error-txt);font-size:12.5px">${e.message}</p>`;
  }
}

async function verDetalle(id) {
  MEDICO_ACTIVO = id;
  ver('v-detalle');
  try {
    const d = await api('cirujanos.detalle', { medicoId: id });
    document.getElementById('d-nombre').textContent = d.medico.nombre;
    document.getElementById('d-esp').textContent = d.medico.especialidad || d.medico.tipo;
    document.getElementById('d-anillo').innerHTML = anillo(d.resumen.listos, d.resumen.total, 'grande');
    document.getElementById('d-docs').innerHTML = d.documentos.map(tarjetaDoc).join('');
  } catch (e) {
    document.getElementById('d-docs').innerHTML = `<p style="grid-column:1/-1;color:var(--zx-error-txt);font-size:12.5px">${e.message}</p>`;
  }
}

/* ---------- Visor ---------- */

async function abrirDoc(credId) {
  const v = document.getElementById('visor');
  const cuerpo = document.getElementById('vi-cuerpo');
  v.classList.remove('oculto'); v.style.display = 'flex';
  cuerpo.textContent = 'Abriendo…';
  document.getElementById('vi-nombre').textContent = '';
  try {
    const a = await api('cirujanos.archivo', { credId });
    document.getElementById('vi-nombre').textContent = a.nombre;

    // Los PDF incrustados como data: los bloquea el navegador por seguridad.
    // Un blob es un archivo real en memoria y sí se puede mostrar.
    const bin = atob(a.datos);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (URL_ACTUAL) URL.revokeObjectURL(URL_ACTUAL);
    URL_ACTUAL = URL.createObjectURL(new Blob([bytes], { type: a.mime }));

    cuerpo.innerHTML = a.mime.indexOf('pdf') > -1
      ? `<iframe src="${URL_ACTUAL}" style="width:100%;height:70vh;border:0;border-radius:10px"></iframe>
         <p style="margin:11px 0 0"><a href="${URL_ACTUAL}" target="_blank" rel="noopener"
            class="zx-btn-2" style="display:inline-block;height:32px;line-height:32px;padding:0 14px;
            font-size:12px;text-decoration:none">Abrir en pestaña nueva</a></p>`
      : `<img src="${URL_ACTUAL}" alt="${a.nombre}" style="max-width:100%;border-radius:10px">`;
  } catch (e) {
    cuerpo.innerHTML = `<p style="color:var(--zx-error-txt)">${e.message}</p>`;
  }
}

function cerrarVisor(ev) {
  if (ev && ev.target.id !== 'visor') return;
  const v = document.getElementById('visor');
  v.classList.add('oculto'); v.style.display = 'none';
  document.getElementById('vi-cuerpo').innerHTML = '';
  if (URL_ACTUAL) { URL.revokeObjectURL(URL_ACTUAL); URL_ACTUAL = null; }
}

function pedirArchivo(tipo, vence) {
  DOC_PENDIENTE = { tipo, vence };
  document.getElementById('picker').click();
}

document.getElementById('picker').onchange = async function () {
  const f = this.files[0];
  this.value = '';
  if (!f || !DOC_PENDIENTE) return;

  if (f.size > 8 * 1024 * 1024) {
    alert('El archivo pesa más de 8 MB. Comprímalo o tome la foto en menor calidad.');
    return;
  }

  let vence = '';
  if (DOC_PENDIENTE.vence) {
    vence = prompt('¿Cuándo vence este documento? Escríbalo como 2027-05-31');
    if (!vence) return;
  }

  const base64 = await new Promise((ok, mal) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.split(',')[1]);
    r.onerror = () => mal(new Error('No se pudo leer el archivo.'));
    r.readAsDataURL(f);
  });

  try {
    await api('cirujanos.subir', {
      medicoId: MEDICO_ACTIVO || undefined,
      tipo: DOC_PENDIENTE.tipo,
      vence, archivo: base64,
      nombreArchivo: f.name, mime: f.type
    });
    SESION.esStaff ? verDetalle(MEDICO_ACTIVO) : verMio();
  } catch (e) {
    alert(e.message);
  }
};
