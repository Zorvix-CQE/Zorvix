<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zorvix · Cirujanos</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../zorvix-tokens.css">
<style>
  .app   { min-height: 100vh; position: relative; }
  .centro{ max-width: 400px; margin: 0 auto; padding: 56px 20px; position: relative; }
  .shell { max-width: 940px; margin: 0 auto; padding: 24px 20px 48px; position: relative; }

  .barra { display:flex; align-items:center; gap:11px; background: var(--zx-superficie);
           border: var(--zx-hairline) solid var(--zx-borde); border-radius: 10px;
           padding: 11px 15px; margin-bottom: var(--zx-gap); }
  .volver{ background:none; border:none; padding:0; cursor:pointer; font-family:var(--zx-texto);
           font-size:12px; color: var(--zx-txt-3); }

  .doc { display:flex; align-items:center; gap:13px; padding:13px 0;
         border-bottom: var(--zx-hairline) solid var(--zx-borde); }
  .doc:last-child { border-bottom: none; }
  .doc-nom  { font-size: 14px; color: var(--zx-txt); }
  .doc-sub  { font-size: 11.5px; color: var(--zx-txt-3); margin-top: 3px; }

  .med { display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;
         border-bottom: var(--zx-hairline) solid var(--zx-borde); }
  .med:last-child { border-bottom: none; }
  .med:hover { background: var(--zx-hover); }

  .punto { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .oculto{ display:none; }
  .aviso { font-size:12.5px; color: var(--zx-error-txt); background: var(--zx-error-bg);
           border-radius: var(--zx-r-control); padding:10px 13px; margin-top:14px; }
</style>
</head>
<body>

<div class="app">
  <div class="zx-luz"></div>
  <div class="zx-reticula"></div>

  <!-- ============ Acceso ============ -->
  <section class="centro" id="v-acceso">
    <div class="zx-cristal">
      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:26px">
        <svg viewBox="0 0 256 256" width="58" height="58" class="zx-icono-3d" role="img" aria-label="Zorvix">
          <defs><linearGradient id="zg" x1=".1" y1=".06" x2=".9" y2=".94">
            <stop offset="0" stop-color="#F2ECFD"/><stop offset=".2" stop-color="#7F62C4"/>
            <stop offset=".42" stop-color="#BEAEE3"/><stop offset=".62" stop-color="#8F75CC"/>
            <stop offset=".82" stop-color="#D6CAEF"/><stop offset="1" stop-color="#8468C7"/>
          </linearGradient></defs>
          <path fill="url(#zg)" fill-rule="evenodd" d="M118.82 255.41C94.51 253.72 70.91 244.94 51.29 230.28C45.14 225.69 34.40 215.44 29.14 209.15C18.12 195.97 8.53 177.24 4.12 160.30C0.63 146.88 -0.81 129.22 0.51 116.03C3.55 85.72 16.23 58.85 37.54 37.54C57.26 17.81 81.47 5.64 109.63 1.30C117.54 0.08 136.90 -0.07 144.42 1.03C163.92 3.88 182.10 10.68 197.84 21.01C209.49 28.64 220.71 39.03 229.17 50.00C242.65 67.49 251.73 89.43 254.59 111.47C255.66 119.73 255.69 136.33 254.64 144.14C252.37 161.02 246.99 177.02 238.73 191.42C219.75 224.53 186.76 247.50 148.83 254.02C144.08 254.84 129.38 256.07 126.33 255.91C125.57 255.87 122.18 255.65 118.82 255.41ZM133.02 216.54C144.07 208.20 153.23 199.14 163.47 186.43C169.07 179.48 185.92 154.34 191.17 145.11C197.82 133.42 203.27 119.32 206.28 106.02C207.62 100.09 209.80 86.64 209.81 84.25C209.81 83.32 208.80 82.62 204.77 80.77C194.69 76.15 182.06 72.35 168.63 69.90C146.73 65.89 110.34 64.51 93.50 67.05C81.38 68.87 68.27 72.73 54.65 78.49L47.81 81.38L48.17 85.35C49.58 100.65 54.07 117.56 61.27 134.68C64.51 142.37 73.43 160.12 78.61 169.18C90.14 189.34 101.67 202.25 121.31 216.98C124.21 219.16 126.72 220.94 126.89 220.94C127.05 220.94 129.81 218.96 133.02 216.54Z"/>
        </svg>
        <div class="zx-wordmark" style="font-size:16px;margin-top:14px">ZORVIX</div>
        <div class="zx-eyebrow" style="margin-top:7px">Expediente del cirujano</div>
      </div>
      <div id="btn-google" style="display:flex;justify-content:center"></div>
      <div class="aviso oculto" id="err" role="alert"></div>
    </div>
  </section>

  <!-- ============ Mi expediente · médico ============ -->
  <section class="shell oculto" id="v-medico">
    <div class="barra">
      <svg viewBox="0 0 48 48" width="17" height="17" fill="none" stroke="var(--zx-txt-marca)"
           stroke-width="3.5" aria-hidden="true"><circle cx="24" cy="24" r="19"/></svg>
      <span class="zx-wordmark" style="font-size:11px;letter-spacing:.2em">ZORVIX</span>
      <span style="color:var(--zx-txt-3)">/</span>
      <span style="font-size:12.5px;color:var(--zx-txt-2)">Mi expediente</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--zx-txt-2)" id="yo"></span>
    </div>

    <div class="zx-cristal" style="margin-bottom:var(--zx-gap)">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <div>
          <div class="zx-eyebrow">Documentación</div>
          <div class="zx-titulo" style="margin-top:7px" id="m-resumen">—</div>
        </div>
        <span class="zx-pill" id="m-estado"></span>
      </div>
      <p style="font-size:12px;color:var(--zx-txt-3);margin:12px 0 0;line-height:1.55">
        Sube una foto legible o el PDF. Te avisamos 60 días antes de que algo venza,
        para que no tengas que estar pendiente.
      </p>
    </div>

    <div class="zx-tarjeta" id="m-docs"></div>
  </section>

  <!-- ============ Lista · staff ============ -->
  <section class="shell oculto" id="v-staff">
    <div class="barra">
      <svg viewBox="0 0 48 48" width="17" height="17" fill="none" stroke="var(--zx-txt-marca)"
           stroke-width="3.5" aria-hidden="true"><circle cx="24" cy="24" r="19"/></svg>
      <span class="zx-wordmark" style="font-size:11px;letter-spacing:.2em">ZORVIX</span>
      <span style="color:var(--zx-txt-3)">/</span>
      <span style="font-size:12.5px;color:var(--zx-txt-2)">Cirujanos</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--zx-txt-2)" id="yo2"></span>
    </div>
    <div class="zx-tarjeta" style="padding:0"><div id="s-lista"></div></div>
  </section>

  <!-- ============ Detalle · staff ============ -->
  <section class="shell oculto" id="v-detalle">
    <div class="barra">
      <button class="volver" onclick="verLista()">‹ Cirujanos</button>
      <span style="color:var(--zx-txt-3)">/</span>
      <span style="font-size:12.5px;color:var(--zx-txt)" id="d-nombre"></span>
      <span style="margin-left:auto" class="zx-pill" id="d-estado"></span>
    </div>
    <div class="zx-tarjeta" id="d-docs"></div>
  </section>
</div>

<input type="file" id="picker" class="oculto" accept="image/*,application/pdf">

<script>
// Se define ANTES de cargar Google: si el script llega primero, ya hay quien lo reciba.
window.__gsi = false;
function gsiListo() { window.__gsi = true; if (window.arrancar) window.arrancar(); }
function gsiFallo() {
  var e = document.getElementById('err');
  e.textContent = 'No se pudo cargar el acceso de Google. Revisa tu conexión o desactiva el bloqueador de anuncios para este sitio.';
  e.classList.remove('oculto');
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gsiListo()" onerror="gsiFallo()"></script>
<script>
const CONFIG = {
  GATEWAY:   'https://script.google.com/macros/s/AKfycbz_OAC1XzJ7htPkP5aV__8a9bJkfB3qQw_1OtYdBojgoa5sCq0MjqCfuIO5VlbaEcGm-g/exec',
  CLIENT_ID: '148311031818-4ku0lhia6qd0fgbmi379dvi7k4vp303g.apps.googleusercontent.com'
};

let SESION = null, MEDICO_ACTIVO = null, DOC_PENDIENTE = null;

async function api(action, datos = {}) {
  const token = sessionStorage.getItem('zx_token');
  const r = await fetch(CONFIG.GATEWAY, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token, ...datos })
  });
  const res = await r.json();
  if (!res.ok) {
    if (/sesión/i.test(res.error)) { sessionStorage.removeItem('zx_token'); ver('v-acceso'); }
    throw new Error(res.error);
  }
  return res.data;
}

function ver(id) {
  ['v-acceso','v-medico','v-staff','v-detalle'].forEach(v =>
    document.getElementById(v).classList.toggle('oculto', v !== id));
}

let DOM_LISTO = false, YA_ARRANCO = false;

// El script de Google es async: puede llegar antes o después de que la página
// termine. Arrancamos cuando ambos estén listos, no cuando uno lo esté.
window.arrancar = function () {
  if (!window.__gsi || !DOM_LISTO || YA_ARRANCO) return;
  YA_ARRANCO = true;

  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: r => { sessionStorage.setItem('zx_token', r.credential); iniciar(); },
    auto_select: true
  });
  google.accounts.id.renderButton(document.getElementById('btn-google'),
    { theme: 'filled_black', size: 'large', width: 320, text: 'continue_with', locale: 'es' });

  if (sessionStorage.getItem('zx_token')) iniciar();
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { DOM_LISTO = true; window.arrancar(); });
} else { DOM_LISTO = true; window.arrancar(); }

async function iniciar() {
  try {
    SESION = await api('cirujanos.sesion');
    // Una sola app, dos caras. El médico entra y ya está adentro de lo suyo;
    // nunca ve la lista de sus colegas.
    if (SESION.esStaff) { document.getElementById('yo2').textContent = SESION.nombre || SESION.correo; verLista(); }
    else { document.getElementById('yo').textContent = SESION.nombre || SESION.correo; verMio(); }
  } catch (e) {
    document.getElementById('err').textContent = e.message;
    document.getElementById('err').classList.remove('oculto');
    ver('v-acceso');
  }
}

/* ---------- Médico ---------- */

async function verMio() {
  ver('v-medico');
  try {
    const d = await api('cirujanos.mios');
    document.getElementById('m-resumen').textContent = `${d.resumen.listos} de ${d.resumen.total} al día`;
    const p = document.getElementById('m-estado');
    p.textContent = d.resumen.bloqueado ? 'Acción requerida' : 'Todo en orden';
    p.className = 'zx-pill ' + (d.resumen.bloqueado ? 'error' : 'ok');
    document.getElementById('m-docs').innerHTML = d.documentos.map(x => filaDoc(x, true)).join('');
  } catch (e) {
    document.getElementById('m-docs').innerHTML = `<p style="color:var(--zx-error-txt);font-size:12.5px">${e.message}</p>`;
  }
}

/* ---------- Staff ---------- */

async function verLista() {
  ver('v-staff');
  const c = document.getElementById('s-lista');
  try {
    const meds = await api('cirujanos.listar');
    if (!meds.length) {
      c.innerHTML = '<p style="padding:16px;color:var(--zx-txt-3);font-size:12.5px">Aún no hay médicos dados de alta.</p>';
      return;
    }
    c.innerHTML = meds.map(m => `
      <div class="med" onclick="verDetalle('${m.medicoId}')">
        <span class="punto" style="background:${colorMed(m)}"></span>
        <span style="flex:1;min-width:0">
          <span style="font-size:13.5px;color:var(--zx-txt)">${m.nombre}</span>
          <br><span style="font-size:11px;color:var(--zx-txt-3)">${m.especialidad || m.tipo}</span>
        </span>
        ${m.porVerificar ? `<span class="zx-pill alerta" style="font-size:10px">${m.porVerificar} por revisar</span>` : ''}
        <span class="zx-num" style="width:44px;color:${colorMed(m)}">${m.listos}/${m.total}</span>
      </div>`).join('');
  } catch (e) {
    c.innerHTML = `<p style="padding:16px;color:var(--zx-error-txt);font-size:12.5px">${e.message}</p>`;
  }
}

// No informa: prioriza. Rojo es "hoy no puede operar".
function colorMed(m) {
  if (m.bloqueado) return 'var(--zx-error)';
  if (m.proximoVence !== null && m.proximoVence < 60) return 'var(--zx-alerta)';
  return 'var(--zx-ok)';
}

async function verDetalle(id) {
  MEDICO_ACTIVO = id;
  ver('v-detalle');
  try {
    const d = await api('cirujanos.detalle', { medicoId: id });
    document.getElementById('d-nombre').textContent = d.medico.nombre;
    const p = document.getElementById('d-estado');
    p.textContent = `${d.resumen.listos}/${d.resumen.total}`;
    p.className = 'zx-pill ' + (d.resumen.bloqueado ? 'error' : 'ok');
    document.getElementById('d-docs').innerHTML = d.documentos.map(x => filaDoc(x, true)).join('');
  } catch (e) {
    document.getElementById('d-docs').innerHTML = `<p style="color:var(--zx-error-txt);font-size:12.5px">${e.message}</p>`;
  }
}

/* ---------- Documento ---------- */

const ETIQUETAS = {
  falta:        ['Falta',        'error'],
  vencido:      ['Vencido',      'error'],
  por_vencer:   ['Por vencer',   'alerta'],
  por_verificar:['En revisión',  'alerta'],
  rechazado:    ['Rechazado',    'error'],
  vigente:      ['Vigente',      'ok']
};

function filaDoc(d, editable) {
  const [txt, tono] = ETIQUETAS[d.estado] || ['—',''];
  const sub = d.estado === 'por_vencer' ? `Vence en ${d.dias} días`
            : d.estado === 'vencido'    ? `Venció hace ${Math.abs(d.dias)} días`
            : d.fechaVence              ? `Vence ${String(d.fechaVence).slice(0,10)}`
            : d.obligatorio             ? 'Obligatorio' : 'Opcional';
  return `
    <div class="doc">
      <span class="zx-anillo" style="width:34px;height:34px">
        <i class="ti ${d.archivo ? 'ti-file-check' : 'ti-file-plus'}" style="font-size:17px" aria-hidden="true"></i>
      </span>
      <span style="flex:1;min-width:0">
        <span class="doc-nom">${d.nombre}</span>
        <span class="doc-sub">${sub}${d.nota ? ' · ' + d.nota : ''}</span>
      </span>
      <span class="zx-pill ${tono}" style="font-size:10.5px">${txt}</span>
      ${d.archivo ? `<a href="${d.archivo}" target="_blank" rel="noopener" class="zx-btn-2"
           style="height:32px;padding:0 13px;font-size:12px;line-height:32px;text-decoration:none">Ver</a>` : ''}
      ${editable ? `<button class="zx-btn" style="height:32px;padding:0 15px;font-size:12px"
           onclick="pedirArchivo('${d.id}', ${d.vence})">${d.archivo ? 'Reemplazar' : 'Subir'}</button>` : ''}
    </div>`;
}

function pedirArchivo(tipo, vence) {
  DOC_PENDIENTE = { tipo, vence };
  document.getElementById('picker').click();
}

document.getElementById('picker').onchange = async function () {
  const f = this.files[0];
  this.value = '';
  if (!f || !DOC_PENDIENTE) return;

  // Se valida aquí y también en el servidor: nunca confíes solo en el navegador.
  if (f.size > 8 * 1024 * 1024) {
    alert('El archivo pesa más de 8 MB. Comprímelo o toma la foto en menor calidad.');
    return;
  }

  let vence = '';
  if (DOC_PENDIENTE.vence) {
    vence = prompt('¿Cuándo vence este documento? Escríbelo como 2027-05-31');
    if (!vence) return;
  }

  const base64 = await new Promise((ok, mal) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.split(',')[1]);
    r.onerror = () => mal(new Error('No se pudo leer el archivo.'));
    r.readAsDataURL(f);
  });

  try {
    await api('cirujanos.subir', {
      medicoId: MEDICO_ACTIVO || undefined,
      tipo: DOC_PENDIENTE.tipo,
      vence, archivo: base64,
      nombreArchivo: f.name, mime: f.type
    });
    SESION.esStaff ? verDetalle(MEDICO_ACTIVO) : verMio();
  } catch (e) {
    alert(e.message);
  }
};
</script>
</body>
</html>
